name: Pruebas

# En cada propuesta de cambio y en cada subida a main. Los trabajos van por separado para
# que el fallo señale de qué se trata: el juego o las reglas de Firestore.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  juego:
    name: Motor, códigos de sala y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  salas:
    name: Reglas de Firestore y salas online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Los emuladores de Firestore y Auth son programas Java, así que hace falta una JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:reglas
      - run: npm run test:online
      - run: npm run test:acceso

  mus-movil:
    name: Mus en Android e iPhone (Chromium y WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build:web
      - run: node --no-warnings tests/mus-mobile.mjs
      - run: node --no-warnings tests/mus-offline.mjs
      - run: MUS_BROWSER=webkit node --no-warnings tests/mus-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mus-movil
          path: tests/artifacts/mus
