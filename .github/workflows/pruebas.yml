name: Pruebas

# En cada propuesta de cambio y en cada subida a main. Los trabajos van por separado para
# que el fallo señale de qué se trata: el juego o las reglas de Firestore.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  juego:
    name: Motor, códigos de sala y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  salas:
    name: Reglas de Firestore y salas online
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Los emuladores de Firestore y Auth son programas Java, así que hace falta una JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:reglas
      - run: npm run test:online
      - run: npm run test:acceso
