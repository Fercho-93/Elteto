name: Compilar Android LAN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/android-host/**', 'apps/web/**', 'packages/game-core/**', 'tests/**', '.github/workflows/android-lan.yml']
permissions:
  contents: read
jobs:
  # La APK se compila por su cuenta: un fallo en las pruebas de navegador no impide descargarla.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: node tests/lan-session.mjs
      - run: node tests/apk-room-mode.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash tests/prepare-lan-java.sh
      - run: node tests/lan-servidor.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p apps/android-host assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Elteto-LAN-Android-prueba
          path: apps/android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  navegador:
    name: Pruebas de pantalla (Chromium y WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash tests/prepare-lan-java.sh
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/lan-navegador.mjs
        if: ${{ !cancelled() }}
      - run: LAN_BROWSER=webkit node tests/lan-navegador.mjs
        if: ${{ !cancelled() }}
      - run: node tests/table-navegador.mjs
        if: ${{ !cancelled() }}
      - run: TABLE_BROWSER=webkit node tests/table-navegador.mjs
        if: ${{ !cancelled() }}
      - run: node tests/bots-navegador.mjs
        if: ${{ !cancelled() }}
      - run: BOT_BROWSER=webkit node tests/bots-navegador.mjs
        if: ${{ !cancelled() }}
      - run: node tests/physics-screen.mjs
        if: ${{ !cancelled() }}
      - run: PHYSICS_BROWSER=webkit node tests/physics-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/turn-screen.mjs
        if: ${{ !cancelled() }}
      - run: TURN_BROWSER=webkit node tests/turn-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/board-screen.mjs
        if: ${{ !cancelled() }}
      - run: BOARD_BROWSER=webkit node tests/board-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/no-aids.mjs
        if: ${{ !cancelled() }}
      - run: AIDS_BROWSER=webkit node tests/no-aids.mjs
        if: ${{ !cancelled() }}
      - run: node tests/game-help-screen.mjs
        if: ${{ !cancelled() }}
      - run: HELP_BROWSER=webkit node tests/game-help-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/card-art-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/poker-interactions.mjs
        if: ${{ !cancelled() }}
      - run: POKER_BROWSER=webkit node tests/poker-interactions.mjs
        if: ${{ !cancelled() }}
      - run: node tests/poker-screen.mjs
        if: ${{ !cancelled() }}
      - run: POKER_BROWSER=webkit node tests/poker-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/player-experience.mjs
        if: ${{ !cancelled() }}
      - run: EXPERIENCE_BROWSER=webkit node tests/player-experience.mjs
        if: ${{ !cancelled() }}
      - run: node tests/catalog-screen.mjs
        if: ${{ !cancelled() }}
      - run: CATALOG_BROWSER=webkit node tests/catalog-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/cinquillo-layout.mjs
        if: ${{ !cancelled() }}
      - run: LAYOUT_BROWSER=webkit node tests/cinquillo-layout.mjs
        if: ${{ !cancelled() }}
      - run: node tests/rival-portraits.mjs
        if: ${{ !cancelled() }}
      - run: AVATAR_BROWSER=webkit node tests/rival-portraits.mjs
        if: ${{ !cancelled() }}
      - run: node tests/game-screen-flow.mjs
        if: ${{ !cancelled() }}
      - run: FLOW_BROWSER=webkit node tests/game-screen-flow.mjs
        if: ${{ !cancelled() }}
      - run: node tests/parchis-screen.mjs
        if: ${{ !cancelled() }}
      - run: PARCHIS_BROWSER=webkit node tests/parchis-screen.mjs
        if: ${{ !cancelled() }}
      - run: node tests/parchis-dice.mjs
        if: ${{ !cancelled() }}
      - run: PARCHIS_BROWSER=webkit node tests/parchis-dice.mjs
        if: ${{ !cancelled() }}
      - run: node tests/absence-screen.mjs
        if: ${{ !cancelled() }}
      - run: ABSENCE_BROWSER=webkit node tests/absence-screen.mjs
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-y-medidas-mesa
          path: tests/artifacts/
