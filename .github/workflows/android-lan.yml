name: Compilar Android LAN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/android-host/**', 'apps/web/**', 'packages/game-core/**', '.github/workflows/android-lan.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: node tests/lan-session.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash tests/prepare-lan-java.sh
      - run: node tests/lan-servidor.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/lan-navegador.mjs
      - run: LAN_BROWSER=webkit node tests/lan-navegador.mjs
      - run: node tests/table-navegador.mjs
      - run: TABLE_BROWSER=webkit node tests/table-navegador.mjs
      - run: node tests/cinquillo-layout.mjs
      - run: LAYOUT_BROWSER=webkit node tests/cinquillo-layout.mjs
      - run: node tests/rival-portraits.mjs
      - run: AVATAR_BROWSER=webkit node tests/rival-portraits.mjs
      - run: node tests/game-screen-flow.mjs
      - run: FLOW_BROWSER=webkit node tests/game-screen-flow.mjs
      - run: node tests/parchis-screen.mjs
      - run: PARCHIS_BROWSER=webkit node tests/parchis-screen.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-y-medidas-mesa
          path: tests/artifacts/
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p apps/android-host assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Elteto-LAN-Android-prueba
          path: apps/android-host/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
