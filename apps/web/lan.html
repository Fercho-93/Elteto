<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21172b"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./table-layout.css"><link rel="stylesheet" href="./cinquillo-table.css"><link rel="stylesheet" href="./rival-portraits.css"><link rel="stylesheet" href="./mus-screen.css"><link rel="stylesheet" href="./parchis-board.css"><link rel="icon" href="./icon.svg"><title>Elteto · Mesa local</title></head>
<body><main id="app" aria-live="polite"><p>Conectando con la mesa local…</p></main><div id="toast" role="status"></div><script src="./qrcode-generator.js"></script><script src="./qr-encode.js"></script><script type="module">
try {
 const config = await fetch('./lan-config', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()});
 const hostKey = new URLSearchParams(location.hash.slice(1)).get('host');
 if (hostKey) { sessionStorage.setItem('elteto.lanHostKey',hostKey); history.replaceState(null,'',location.pathname); }
 window.ELTETO_LAN = {...config,hostKey:sessionStorage.getItem('elteto.lanHostKey')};
 await import('./app.js');
} catch { document.querySelector('#app').textContent='No se pudo abrir Elteto. Comprueba que estás conectado a la red del anfitrión y vuelve a cargar.'; }
</script></body></html>
