plugins { id 'com.android.application' }
// Read the configuration actually packaged in the APK, never a value from the WebView.
def distributionConfigFile = file('../../../dist/distribution-config.js')
if (!distributionConfigFile.isFile()) throw new GradleException('Run npm run build:web before building Android.')
def developmentFlag = distributionConfigFile.getText('UTF-8') =~ /developmentAdminEnabled\s*:\s*(true|false)/
if (!developmentFlag.find()) throw new GradleException('Missing developmentAdminEnabled in the packaged web configuration.')
def developmentEnabled = developmentFlag.group(1)
def openLanFlag = distributionConfigFile.getText('UTF-8') =~ /openLanAccessEnabled\s*:\s*(true|false)/
if (!openLanFlag.find()) throw new GradleException('Missing openLanAccessEnabled in the packaged web configuration.')
def openLanEnabled = openLanFlag.group(1)
android {
    namespace 'es.elteto.lan'
    compileSdk 35
    defaultConfig {
        applicationId 'es.elteto.lan'; minSdk 26; targetSdk 35; versionCode 11; versionName '0.2.1'
        buildConfigField 'boolean', 'DEVELOPMENT_ADMIN_ENABLED', developmentEnabled
        buildConfigField 'boolean', 'OPEN_LAN_ACCESS_ENABLED', openLanEnabled
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('ELTETO_KEYSTORE')) {
                storeFile file(System.getenv('ELTETO_KEYSTORE'))
                storePassword System.getenv('ELTETO_STORE_PASSWORD')
                keyAlias 'elteto'
                keyPassword System.getenv('ELTETO_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    sourceSets { main.assets.srcDirs += ['../../../dist'] }
}
dependencies {
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    implementation 'com.google.code.gson:gson:2.11.0'
}
